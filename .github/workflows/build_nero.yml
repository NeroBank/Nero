
name: Build NERO Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nero-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NERO Offline Bible
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout NERO
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check NERO project files
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/images/bible_banner.png
          test -f assets/icon/nero_launcher.png

          echo "NERO project files found."

      - name: Confirm Supabase is removed
        shell: bash
        run: |
          set -euo pipefail

          if grep -niE 'supabase_flutter|SupabaseClient|Supabase.initialize|SUPABASE_URL|SUPABASE_ANON_KEY' pubspec.yaml lib/main.dart; then
            echo "ERROR: Supabase references remain."
            exit 1
          fi

          echo "Confirmed: NERO has no Supabase dependency."

      - name: Create Android platform if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --project-name nero_bible .
          fi

      - name: Download and prepare all 66 KJV books
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import pathlib
          import urllib.request
          import urllib.parse

          books = [
              "Genesis", "Exodus", "Leviticus", "Numbers",
              "Deuteronomy", "Joshua", "Judges", "Ruth",
              "1 Samuel", "2 Samuel", "1 Kings", "2 Kings",
              "1 Chronicles", "2 Chronicles", "Ezra", "Nehemiah",
              "Esther", "Job", "Psalms", "Proverbs",
              "Ecclesiastes", "Song of Solomon", "Isaiah", "Jeremiah",
              "Lamentations", "Ezekiel", "Daniel", "Hosea",
              "Joel", "Amos", "Obadiah", "Jonah",
              "Micah", "Nahum", "Habakkuk", "Zephaniah",
              "Haggai", "Zechariah", "Malachi", "Matthew",
              "Mark", "Luke", "John", "Acts",
              "Romans", "1 Corinthians", "2 Corinthians",
              "Galatians", "Ephesians", "Philippians",
              "Colossians", "1 Thessalonians", "2 Thessalonians",
              "1 Timothy", "2 Timothy", "Titus", "Philemon",
              "Hebrews", "James", "1 Peter", "2 Peter",
              "1 John", "2 John", "3 John", "Jude",
              "Revelation"
          ]

          output = pathlib.Path("assets/bible")
          output.mkdir(parents=True, exist_ok=True)

          base = "https://raw.githubusercontent.com/renniemaharaj/kjv-bible/main/"

          def get_chapters(data):
              if isinstance(data, dict):
                  if isinstance(data.get("chapters"), (dict, list)):
                      return data["chapters"]

                  for value in data.values():
                      if isinstance(value, dict) and isinstance(value.get("chapters"), (dict, list)):
                          return value["chapters"]

                  if data and all(str(k).isdigit() for k in data):
                      return data

              raise ValueError("Unsupported Bible chapter structure")

          def normalize(book, data):
              source = get_chapters(data)
              result = {}

              entries = enumerate(source, 1) if isinstance(source, list) else source.items()

              for chapter_number, chapter in entries:
                  if isinstance(chapter, dict) and "verses" in chapter:
                      chapter = chapter["verses"]

                  verses = {}

                  if isinstance(chapter, list):
                      for index, verse in enumerate(chapter, 1):
                          if isinstance(verse, dict):
                              number = verse.get("verse", index)
                              text = verse.get("text", verse.get("verse_text", ""))
                          else:
                              number, text = index, verse

                          verses[str(number)] = str(text)

                  elif isinstance(chapter, dict):
                      for number, verse in chapter.items():
                          if isinstance(verse, dict):
                              verse = verse.get("text", verse.get("verse_text", ""))

                          verses[str(number)] = str(verse)

                  if not verses:
                      raise ValueError(f"{book} chapter {chapter_number} is empty")

                  result[str(chapter_number)] = verses

              if not result:
                  raise ValueError(f"{book} has no chapters")

              return {
                  "book": book,
                  "chapters": result
              }

          total_verses = 0

          for book in books:
              filename = urllib.parse.quote(book + ".json")
              url = base + filename

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "NERO-Offline-Bible"}
              )

              print("Downloading:", book)

              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.loads(response.read().decode("utf-8-sig"))

              bible = normalize(book, data)

              total_verses += sum(
                  len(verses)
                  for verses in bible["chapters"].values()
              )

              name = book.lower().replace(" ", "_") + ".json"

              (output / name).write_text(
                  json.dumps(bible, ensure_ascii=False),
                  encoding="utf-8"
              )

              print("Prepared:", name)

          actual = list(output.glob("*.json"))

          if len(actual) != 66:
              raise SystemExit(
                  f"Expected 66 Bible books, found {len(actual)}"
              )

          print("All 66 KJV books prepared.")
          print("Total verses:", total_verses)
          PY

      - name: Verify Bible asset structure
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("assets/bible")
          files = list(folder.glob("*.json"))

          if len(files) != 66:
              raise SystemExit("The Bible must contain exactly 66 books.")

          for file in files:
              data = json.loads(file.read_text(encoding="utf-8"))
              if not isinstance(data.get("chapters"), dict):
                  raise SystemExit(f"Invalid chapter structure: {file.name}")

          print("All 66 Bible files have the required chapters structure.")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate NERO launcher icon
        run: dart run flutter_launcher_icons

      - name: Build NERO Android APK
        run: flutter build apk --release

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"
          ls -lh "$APK"

      - name: Upload NERO Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: NERO-Offline-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
