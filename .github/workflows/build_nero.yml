
name: Build NERO Offline Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nero-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NERO Offline Bible APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out NERO repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check required NERO files
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tool/download_kjv.py
          test -f assets/images/bible_banner.png
          test -f assets/images/icon/nero_launcher.png

          echo "All required NERO project files are present."

      - name: Check English-only app source
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("lib/main.dart"),
              Path("pubspec.yaml"),
              Path("tool/download_kjv.py"),
          ]

          pattern = re.compile(
              r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]"
          )

          for file in files:
              content = file.read_text(encoding="utf-8")
              if pattern.search(content):
                  raise SystemExit(
                      f"Non-English characters found in {file}"
                  )

          print("English-only source check passed.")
          PY

      - name: Confirm Supabase and Firebase are removed
        shell: bash
        run: |
          set -euo pipefail

          if grep -niE \
            'supabase|firebase|SUPABASE_URL|SUPABASE_ANON_KEY' \
            pubspec.yaml lib/main.dart; then
            echo "ERROR: Online backend references remain."
            exit 1
          fi

          echo "No Supabase or Firebase references found."

      - name: Generate Android project if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            flutter create \
              --platforms=android \
              --project-name nero_bible \
              .
          fi

          test -f android/gradlew

      - name: Download all 66 KJV Bible books
        shell: bash
        run: |
          set -euo pipefail
          python tool/download_kjv.py

      - name: Validate complete offline Bible data
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          folder = Path("assets/bible")
          files = sorted(folder.glob("*.json"))

          if len(files) != 66:
              raise SystemExit(
                  f"Expected 66 Bible books, found {len(files)}"
              )

          cjk = re.compile(
              r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]"
          )

          total_chapters = 0
          total_verses = 0

          for file in files:
              raw = file.read_text(encoding="utf-8")

              if cjk.search(raw):
                  raise SystemExit(
                      f"Non-English characters found in {file.name}"
                  )

              data = json.loads(raw)
              chapters = data.get("chapters")

              if not isinstance(chapters, dict) or not chapters:
                  raise SystemExit(
                      f"Invalid chapter data in {file.name}"
                  )

              total_chapters += len(chapters)

              for chapter, verses in chapters.items():
                  if not isinstance(verses, dict) or not verses:
                      raise SystemExit(
                          f"Invalid verses in {file.name}, chapter {chapter}"
                      )

                  total_verses += len(verses)

          if total_verses < 30000:
              raise SystemExit(
                  f"Bible data appears incomplete: {total_verses} verses"
              )

          print("Bible data validation passed.")
          print(f"Books: 66")
          print(f"Chapters: {total_chapters}")
          print(f"Verses: {total_verses}")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate NERO launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          echo "NERO APK successfully generated."
          ls -lh "$APK"

      - name: Upload NERO APK
        uses: actions/upload-artifact@v4
        with:
          name: NERO-Offline-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
