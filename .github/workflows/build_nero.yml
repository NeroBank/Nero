name: Build NERO Offline Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nero-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NERO Offline Bible
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out NERO
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tool/download_kjv.py
          test -f assets/images/bible_banner.png
          test -f assets/images/icon/nero_launcher.png
          echo "NERO project files verified."

      - name: Check English-only source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("lib/main.dart"),
              Path("pubspec.yaml"),
              Path("tool/download_kjv.py")
          ]

          pattern = re.compile(
              r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]"
          )

          for file in files:
              if pattern.search(file.read_text(encoding="utf-8")):
                  raise SystemExit(f"Non-English characters found: {file}")

          print("English-only source check passed.")
          PY

      - name: Confirm backend removal
        run: |
          set -euo pipefail
          if grep -niE 'supabase|firebase' pubspec.yaml lib/main.dart; then
            echo "Unexpected online backend reference found."
            exit 1
          fi
          echo "No Supabase or Firebase references found."

      - name: Generate Android project if missing
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            flutter create \
              --platforms=android \
              --project-name nero_bible \
              .
          fi
          test -f android/gradlew

      - name: Set launcher app name to Nero
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'(<application\b[^>]*\bandroid:label=")[^"]*(")',
              r'\g<1>Nero\g<2>',
              content,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  "Could not find the application label in AndroidManifest.xml"
              )

          manifest.write_text(updated, encoding="utf-8")

          if 'android:label="Nero"' not in updated:
              raise SystemExit("Launcher name verification failed.")

          print("Launcher app name successfully set to Nero.")
          PY

      - name: Download all 66 KJV books
        run: python tool/download_kjv.py

      - name: Validate Bible data
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          files = sorted(Path("assets/bible").glob("*.json"))

          if len(files) != 66:
              raise SystemExit(
                  f"Expected 66 books, found {len(files)}"
              )

          total_verses = 0
          cjk = re.compile(
              r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]"
          )

          for file in files:
              raw = file.read_text(encoding="utf-8")

              if cjk.search(raw):
                  raise SystemExit(
                      f"Non-English text found in {file.name}"
                  )

              data = json.loads(raw)
              chapters = data.get("chapters")

              if not isinstance(chapters, dict) or not chapters:
                  raise SystemExit(
                      f"Invalid Bible data: {file.name}"
                  )

              for chapter, verses in chapters.items():
                  if not isinstance(verses, dict) or not verses:
                      raise SystemExit(
                          f"Invalid chapter in {file.name}: {chapter}"
                      )
                  total_verses += len(verses)

          if total_verses < 30000:
              raise SystemExit(
                  f"Incomplete Bible: {total_verses} verses"
              )

          print("All 66 KJV books validated.")
          print(f"Total verses: {total_verses}")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze NERO app source
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload NERO APK
        uses: actions/upload-artifact@v4
        with:
          name: NERO-Offline-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
